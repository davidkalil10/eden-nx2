name: Build Eden-NX2 (Nintendo Switch 2)

on:
  push:
    branches: [ master, main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "CMake target(s) to build (e.g. common, dynarmic, core, yuzu-cmd)"
        required: false
        default: "yuzu-cmd"

jobs:
  build-switch2:
    name: Switch 2 Bring-Up (ounce-devkit + OunceVK + kaiHEN)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Install host build tools, CMake 3.31.6, Switch portlibs & ounce-devkit (20261115b)
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ninja-build ccache perl python3 pkg-config curl ca-certificates xz-utils bzip2 zstd patch bison flex glslang-tools
          curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local
          cmake --version
          for attempt in 1 2 3 4 5; do
            if dkp-pacman -Sy --noconfirm --needed \
              switch-dev switch-portlibs switch-zlib switch-libzstd switch-lz4 \
              switch-libopus switch-ffmpeg switch-mbedtls switch-libpng switch-freetype; then
              break
            fi
            echo "dkp-pacman attempt $attempt failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          sdk="$(mktemp -d)"
          git clone https://github.com/ouncebrew/ounce-devkit.git "$sdk"
          git -C "$sdk" checkout 0f38ba80d7ee768c5749278f127749d14ece2036
          bash "$sdk/install.sh" "20261115b"
          rm -rf "$sdk"

      - name: Cache CPM packages and Switch 2 SDL3
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            build-switch2-deps/sdl-prefix
          key: eden-nx2-deps-v1-${{ hashFiles('cpmfile.json', 'scripts/build-switch2.sh') }}
          restore-keys: |
            eden-nx2-deps-v1-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: eden-nx2-ccache-${{ github.sha }}
          restore-keys: |
            eden-nx2-ccache-

      - name: Configure, build and package Switch 2 NRO
        env:
          EDEN_SWITCH2_TARGET: ${{ github.event.inputs.target || 'yuzu-cmd' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1500M
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines
          EDEN_USE_CCACHE: "1"
        run: bash scripts/build-switch2.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: eden-nx2-ccache-${{ github.sha }}

      - name: Upload Switch 2 NRO artifact
        if: ${{ hashFiles('dist/eden-switch2.nro') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eden-switch2-nro
          path: dist/eden-switch2.nro
          if-no-files-found: error
